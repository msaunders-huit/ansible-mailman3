---

- name: Include user creation tasks
  include_tasks: user.yml
  when: mailman3_create_user

- name: Include group discovery tasks
  import_tasks: group_discovery.yml

- name: Include generic installation tasks
  import_tasks: "install_{{ mailman3_install_method }}.yml"

- name: Include core installation tasks
  import_tasks: "install_core_{{ mailman3_install_method }}.yml"
  when: "'mailman_core' in group_names"

- name: Include core configuration tasks
  import_tasks: config_core.yml
  when: "'mailman_core' in group_names"

- name: Include web installation tasks
  import_tasks: "install_web_{{ mailman3_install_method }}.yml"
  when: "'mailman_web' in group_names"

- name: Include web configuration tasks
  import_tasks: config_web.yml
  when: "'mailman_web' in group_names"

- name: Include Postfix map distribution tasks
  include_tasks: distribute_maps.yml
  when: mailman3_distribute_maps is defined and "'mailman_core' in group_names"

# Perform whatever restarts are needed now, prevents double restart on first run
- name: Flush handlers
  meta: flush_handlers

- name: Ensure Mailman Core is enabled and running
  service:
    name: "{{ mailman3_core_service_name }}"
    enabled: yes
    state: started
  when: mailman3_process_manager != "supervisor" and 'mailman_core' in group_names
  ignore_errors: yes

- name: Ensure Mailman Web is enabled and running
  service:
    name: "{{ mailman3_web_service_name }}{{ '@' if mailman3_domains is defined else '' }}{{ item }}"
    enabled: yes
    state: started
  loop: "{{ mailman3_domains | default(['']) }}"
  when: mailman3_process_manager != "supervisor" and 'mailman_web' in group_names
